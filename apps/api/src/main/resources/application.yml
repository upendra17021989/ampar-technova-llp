spring:
  application:
    name: ampar-api
  config:
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: ${DATABASE_JDBC_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DATABASE_USERNAME:postgres.zborevxprhonbyrfjvxk}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: ${PORT:${API_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  web-origin: ${WEB_ORIGIN:http://localhost:3000}
  enquiry-mail:
    enabled: ${ENQUIRY_EMAIL_ENABLED:false}
    recipient: ${ENQUIRY_EMAIL_RECIPIENT:sales@ampartechnova.com}
    from: ${ENQUIRY_EMAIL_FROM:${SMTP_USERNAME:no-reply@ampartechnova.com}}
  analytics:
    hash-salt: ${ANALYTICS_HASH_SALT:change-this-analytics-salt}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    session-hours: ${ADMIN_SESSION_HOURS:8}
